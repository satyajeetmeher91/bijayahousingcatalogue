<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bijaya Housing - Catalogue</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f6f8;--ink:#1b2430;--mut:#667180;--line:#d9dfe6;--navy:#0a285a;--gold:#b07c18}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--navy);color:#fff;text-align:center;padding:14px 12px 12px;border-bottom:4px solid var(--gold)}
header img{height:64px;background:#fff;border-radius:8px;padding:4px}
header div{letter-spacing:3px;font-size:12px;color:#e6c27a;margin-top:6px}
main{max-width:1000px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
input[type=text]{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:8px}
.btn{border:0;border-radius:8px;padding:11px 14px;font-size:15px;font-weight:700;background:var(--navy);color:#fff}
.btn.sec{background:#e8eef7;color:var(--navy)}.btn.sm{padding:8px 12px;font-size:14px}
.two{display:flex;gap:8px;flex-wrap:wrap}.two .btn{flex:1}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:20px 8px;width:100%}.cbtn small{font-weight:500}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.pcell{text-align:center;font-size:14px}.pcell span{display:block;margin-top:5px;font-weight:600;word-break:break-word}
.pimg{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
em.pr{display:block;font-style:normal;font-weight:700;color:#9a6a0e;font-size:13px;margin-top:2px}
h3{margin:4px 0 6px;color:var(--navy)}h4{margin:16px 0 4px;color:var(--gold)}h4 small{color:var(--mut);font-weight:500}
.shr{display:flex;justify-content:space-between;align-items:center}
.empty{color:var(--mut);text-align:center;padding:24px 6px}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px 12px 30px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:30}
#lb img{max-width:96vw;max-height:92vh;border-radius:6px}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:40}
@media(min-width:600px){.cgrid{grid-template-columns:repeat(3,1fr)}.pgrid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.cgrid{grid-template-columns:repeat(4,1fr)}.pgrid{grid-template-columns:repeat(5,1fr)}}
</style>
</head>

const PRICES = Q.get('p') === '1', CATS = (Q.get('c') || '').split('~').filter(Boolean), SIG = Q.get('s') || '';

const IMG = {}, IMGP = {};

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A = x => esc(JSON.stringify(x));
const uniq = a => [...new Set(a)];
const nz = t => String(t).toLowerCase().replace(/[\u00d7x*]/g, '*').replace(/\s+/g, ' ').trim();
const match = (name, q) => { const n = nz(name); return nz(q).split(' ').filter(Boolean).every(w => n.includes(w)); };
const run = async (fn, ...a) => fn === 'pubPhoto'
  ? (await (await fetch(API + '?photo=' + encodeURIComponent(a[0]))).json()).img
  : await (await fetch(API + '?pub=1&p=' + (a[0] ? 1 : 0) + '&c=' + encodeURIComponent((a[1] || []).join('~')) + '&s=' + encodeURIComponent(a[2] || ''))).json();
const idbGet = async () => null, idbSet = async () => {};
function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2600); }
let _act = 0; const _q = [];
function lim(fn) { return new Promise((res, rej) => { const go = () => { _act++; fn().then(res, rej).finally(() => { _act--; if (_q.length) _q.shift()(); }); }; _act < 4 ? go() : _q.push(go); }); }

// SHARED_START
const money = (pr, un) => (pr === '' || pr == null || isNaN(pr)) ? '' : 'Rs. ' + Number(pr).toLocaleString('en-IN') + (un ? ' per ' + un : '');
const priceLines = p => (p.sizes && p.sizes.length) ? p.sizes.map(z => z.size + (money(z.price, z.unit) ? ' - ' + money(z.price, z.unit) : '')) : [money(p.price, p.unit)].filter(Boolean);
const catOf = p => p.category || 'Uncategorized';
const subOf = p => p.sub || 'Other';
const byName = (a, b) => a.name.localeCompare(b.name);
const lastLast = k => (a, b) => a === k ? 1 : b === k ? -1 : a.localeCompare(b);
const catNames = () => uniq(P.map(catOf)).sort(lastLast('Uncategorized'));
const subNames = c => uniq(P.filter(p => catOf(p) === c).map(subOf)).sort(lastLast('Other'));
const hasSubs = c => subNames(c).some(s => s !== 'Other');

// any image -> JPEG scaled to max side, original shape kept
function norm(u, max = 1200) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height)), w = Math.round(im.width * k), h = Math.round(im.height * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(im, 0, 0, w, h);
      res({ url: c.toDataURL('image/jpeg', 0.85), w, h });
    };
    im.onerror = () => res(null);
    im.src = u;
  });
}
// small copy (max 500px) for grids and PDFs, cached
async function pdfImg(id) {
  if (!id) return null;
  if (IMGP[id]) return IMGP[id];
  const c = await idbGet('t:' + id);
  if (c && (!id.startsWith('cell:') || Date.now() - c.t < 432e5)) return (IMGP[id] = c);
  const full = await getImg(id); if (!full) return null;
  const n = await norm(full, 500);
  if (n) { IMGP[id] = n; idbSet('t:' + id, { ...n, t: Date.now() }); }
  return n;
}

const LOGO_AR = 0.7375;   // logo height / width
const NAVY = [10, 40, 90], GOLD = [176, 124, 24];
function coverPage(d, title, sub) {   // front page of every catalogue PDF
  const W = 210, fill = c => d.setFillColor(c[0], c[1], c[2]), ink = c => d.setTextColor(c[0], c[1], c[2]);
  const spaced = (t, y, gap) => {   // letter-spaced text, centred
    const ws = [...t].map(ch => d.getTextWidth(ch)), tw = ws.reduce((a, w) => a + w, 0) + gap * (t.length - 1);
    let x = (W - tw) / 2; [...t].forEach((ch, i) => { d.text(ch, x, y); x += ws[i] + gap; });
  };
  fill(NAVY); d.rect(0, 0, W, 14, 'F'); fill(GOLD); d.rect(0, 14, W, 1.4, 'F');
  const lw = 128, lh = lw * LOGO_AR;
  d.addImage(LOGO, 'JPEG', (W - lw) / 2, 30, lw, lh);
  let y = 30 + lh + 14;
  d.setDrawColor(GOLD[0], GOLD[1], GOLD[2]); d.setLineWidth(0.5); d.line(75, y, 135, y);
  y += 13; d.setFont('helvetica', 'normal'); d.setFontSize(12); ink(GOLD);
  spaced('PRODUCT CATALOGUE', y, 1.6);
  y += 22; d.setFont('times', 'bold');
  const n = title.length, fs = n <= 12 ? 46 : n <= 16 ? 40 : n <= 22 ? 32 : 26;
  d.setFontSize(fs); ink(NAVY);
  const lines = d.splitTextToSize(title, 170).slice(0, 3), step = fs * 0.3528 * 1.15;
  d.text(lines, W / 2, y, { align: 'center', lineHeightFactor: 1.15 });
  y += (lines.length - 1) * step;
  if (sub) {
    d.setFont('times', 'italic'); d.setFontSize(22); ink(GOLD);
    const sl = d.splitTextToSize(sub, 170).slice(0, 2);
    d.text(sl, W / 2, y + 12, { align: 'center' }); y += 12 + (sl.length - 1) * 9;
  }
  d.setFont('helvetica', 'normal'); d.setFontSize(11); ink([110, 118, 128]);
  d.text(new Date().toLocaleString('en-IN', { month: 'long', year: 'numeric' }), W / 2, y + 14, { align: 'center' });
  fill(NAVY); d.rect(0, 232, W, 65, 'F'); fill(GOLD); d.rect(0, 232, W, 1.4, 'F');
  d.setFont('helvetica', 'bold'); d.setFontSize(13); ink(GOLD);
  spaced('BIJAYA HOUSING', 246, 1.2);
  d.setFont('helvetica', 'normal'); d.setFontSize(10.5); ink([255, 255, 255]);
  ['Main Road, Agalpur', 'Dist - Balangir, Odisha, PIN - 767022', 'Contact Person: Raju Meher  |  Mob: 8114832749', 'Email: bijaya.dreamstudio@gmail.com']
    .forEach((t, i) => d.text(t, W / 2, 255 + i * 6.5, { align: 'center' }));
}

// A4 catalogue: photo 1.5 in (38.1 mm) wide, height follows the real shape; name centred below, then prices
async function catPdf(cats, onlySub, combined) {
  const blocks = [];
  cats.forEach(c => {
    const subs = subNames(c), heads = hasSubs(c);
    if (combined) {
      const secs = subs.map(sn => ({ head: heads ? sn : '', items: P.filter(p => catOf(p) === c && subOf(p) === sn).sort(byName) })).filter(x => x.items.length);
      if (secs.length) blocks.push({ title: c, sections: secs });
    } else subs.forEach(sn => {
      if (onlySub && sn !== onlySub) return;
      const items = P.filter(p => catOf(p) === c && subOf(p) === sn).sort(byName);
      if (items.length) blocks.push({ title: heads ? c + ' - ' + sn : c, sections: [{ head: '', items }] });
    });
  });
  if (!blocks.length) return toast('No products to export');
  toast('Preparing catalogue...');
  const need = blocks.flatMap(g => g.sections.flatMap(x => x.items)).filter(p => p.photo);
  for (let i = 0; i < need.length; i += 4) await Promise.all(need.slice(i, i + 4).map(p => pdfImg(p.photo)));
  const S = 38.1, MX = 12, CW = 46.5, TOP = 24, COLS = 4, LIM = 286, HB = 9, GAP = 3, MAXH = 57.15;
  const d = new jspdf.jsPDF({ unit: 'mm', format: 'a4' });
  const allC = cats.length > 1 && cats.length === catNames().length;   // cover shows what is being downloaded
  const ct = cats.length === 1 ? cats[0] : allC ? 'Complete Catalogue' : cats.length <= 3 ? cats.join(' & ') : 'Selected Categories';
  coverPage(d, ct, cats.length === 1 && onlySub ? (onlySub === 'Other' ? 'Other products' : onlySub) : (cats.length > 3 && !allC ? cats.join(', ') : ''));
  const metric = p => {
    const im = p.photo && IMGP[p.photo], ih = im ? Math.min(S * im.h / im.w, MAXH) : S;
    d.setFont('helvetica', 'normal'); d.setFontSize(9);
    let nl = d.splitTextToSize(p.name, CW - 3);
    if (nl.length > 2) { nl = nl.slice(0, 2); nl[1] = nl[1].slice(0, -3) + '...'; }
    d.setFont('helvetica', 'bold'); d.setFontSize(8);
    const pl = priceLines(p).flatMap(t => d.splitTextToSize(t, CW - 3));
    return { im, ih, nl, pl, h: ih + 5 + nl.length * 3.65 + pl.length * 3.25 + 4 };
  };
  const cell = (p, m, col, y) => {
    const x = MX + col * CW + (CW - S) / 2, cx = MX + col * CW + CW / 2;
    if (m.im) d.addImage(m.im.url, 'JPEG', x, y, S, m.ih); else { d.setDrawColor(190); d.rect(x, y, S, S); }
    d.setFont('helvetica', 'normal'); d.setFontSize(9); d.setTextColor(20);
    d.text(m.nl, cx, y + m.ih + 5, { align: 'center' });
    if (m.pl.length) {
      d.setFont('helvetica', 'bold'); d.setFontSize(8); d.setTextColor(150, 100, 10);
      d.text(m.pl, cx, y + m.ih + 5 + m.nl.length * 3.65 + 0.2, { align: 'center' });
    }
  };
  blocks.forEach(g => {
    d.addPage();
    const head = () => { d.setFont('helvetica', 'normal'); d.setFontSize(16); d.setTextColor(20); d.text(g.title, MX, 16); };
    head();
    let y = TOP;
    const newPage = () => { d.addPage(); head(); y = TOP; };
    const bar = t => {
      d.setFillColor(232, 238, 247); d.rect(MX, y, 186, HB, 'F'); d.setFillColor(176, 124, 24); d.rect(MX, y, 1.6, HB, 'F');
      d.setFont('helvetica', 'bold'); d.setFontSize(11); d.setTextColor(10, 40, 90); d.text(t, MX + 5, y + 6.3); y += HB + GAP;
    };
    g.sections.forEach(sec => {
      const ms = sec.items.map(metric);
      if (sec.head) { if (y + HB + GAP + Math.max(...ms.slice(0, COLS).map(m => m.h)) > LIM) newPage(); bar(sec.head); }
      for (let i = 0; i < sec.items.length; i += COLS) {
        const rm = ms.slice(i, i + COLS), rh = Math.max(...rm.map(m => m.h));
        if (y + rh > LIM) { newPage(); if (sec.head && i > 0) bar(sec.head + ' (continued)'); }
        sec.items.slice(i, i + COLS).forEach((p, k) => cell(p, rm[k], k, y));
        y += rh;
      }
      y += 2;
    });
  });
  d.save('catalogue-' + (cats.length === 1 ? (cats[0] + (onlySub ? '-' + onlySub : '')).replace(/\W+/g, '-') : (allC ? 'all' : 'selected')) + (combined ? '-combined' : '') + '.pdf');
}
// SHARED_END


async function getImg(id) {
  if (!id) return null;
  if (IMG[id]) return IMG[id];
  try { const raw = await lim(() => run('pubPhoto', id)); if (raw) { const n = await norm(raw); if (n) IMG[id] = n.url; } } catch (e) {}
  return IMG[id] || null;
}
function fillThumbs() { document.querySelectorAll('img[data-ph]').forEach(async im => { const n = await pdfImg(im.dataset.ph); im.src = n ? n.url : ''; }); }
document.addEventListener('click', async e => {
  const im = e.target.closest('img.pimg'); if (!im || !im.dataset.ph) return;
  const src = await getImg(im.dataset.ph) || im.getAttribute('src'); if (!src) return;
  $('lbImg').src = src; $('lb').style.display = 'flex';
});
$('logo').src = LOGO;

function openCat(c) { catSel = c; $('q').value = ''; render(); window.scrollTo(0, 0); }
const lineHtml = p => priceLines(p).map(t => `<em class="pr">${esc(t)}</em>`).join('');
const pcell = p => `<div class="pcell">${p.photo ? `<img class="pimg" data-ph="${esc(p.photo)}" alt="">` : '<div class="pimg"></div>'}<span>${esc(p.name)}</span>${lineHtml(p)}</div>`;
function render() {
  const box = $('view'), q = $('q').value.trim();
  if (q) {
    const it = P.filter(p => match(p.name + ' ' + catOf(p) + ' ' + (p.sub || ''), q)).sort(byName);
    box.innerHTML = it.length ? `<div class="pgrid">${it.map(pcell).join('')}</div>` : '<div class="empty">No products found.</div>';
    fillThumbs(); return;
  }
  if (!P.length) { box.innerHTML = '<div class="empty">No products yet.</div>'; return; }
  if (!catSel || !catNames().includes(catSel)) {
    catSel = null; const ns = catNames();
    box.innerHTML = '<div class="cgrid">' + ns.map(c => `<button class="btn sec cbtn" onclick="openCat(${A(c)})"><b>${esc(c)}</b><small>${P.filter(p => catOf(p) === c).length} products</small></button>`).join('') + '</div>'
      + '<div class="two" style="margin-top:14px">' + (ns.some(hasSubs)
        ? '<button class="btn" onclick="catPdf(catNames())">Download full catalogue (by subcategory)</button><button class="btn" onclick="catPdf(catNames(),null,true)">Download full catalogue (combined)</button>'
        : '<button class="btn" onclick="catPdf(catNames())">Download full catalogue (PDF)</button>') + '</div>';
    return;
  }
  const subs = subNames(catSel);
  box.innerHTML = (CATS.length === 1 ? '' : '<div style="margin-bottom:12px"><button class="btn sec sm" onclick="openCat(null)">&larr; All categories</button></div>')
    + '<div class="two" style="margin-bottom:8px">' + (hasSubs(catSel)
      ? '<button class="btn sm" onclick="catPdf([catSel])">PDF by subcategory</button><button class="btn sm" onclick="catPdf([catSel],null,true)">PDF combined</button>'
      : '<button class="btn sm" onclick="catPdf([catSel])">Download PDF</button>') + '</div>'
    + `<h3>${esc(catSel)}</h3>` + subs.map(sn => {
      const it = P.filter(p => catOf(p) === catSel && subOf(p) === sn).sort(byName), multi = subs.length > 1 || sn !== 'Other';
      return (multi ? `<div class="shr"><h4>${esc(sn)} <small>(${it.length})</small></h4><button class="btn sec sm" onclick="catPdf([catSel],${A(sn)})">PDF</button></div>` : '') + `<div class="pgrid">${it.map(pcell).join('')}</div>`;
    }).join('');
  fillThumbs();
}
run('pubData', PRICES, CATS, SIG).then(r => { P = r.items; if (CATS.length === 1 && P.length) catSel = catOf(P[0]); render(); }).catch(() => { $('view').innerHTML = '<div class="empty">Could not load the catalogue. Please try again.</div>'; });
</script>
